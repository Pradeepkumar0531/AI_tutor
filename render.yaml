# Render blueprint for the existing implementation (docs/DEPLOYMENT.md is the
# runbook). No secrets here: secret values are set in the Render dashboard
# (sync: false). Frontend deploys separately to Vercel (frontend/vercel.json).
services:
  - type: web
    name: alc-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -e ."
    preDeployCommand: "alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: neon
      - key: NEON_STORAGE_ENDPOINT
        sync: false
      - key: NEON_STORAGE_REGION
        sync: false
      - key: NEON_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: NEON_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: NEON_STORAGE_BUCKET_NAME
        sync: false

  - type: worker
    name: alc-worker
    runtime: python
    rootDir: backend
    buildCommand: "pip install -e ."
    startCommand: "celery -A app.jobs.worker.celery worker --loglevel=info --concurrency=2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: neon
      - key: NEON_STORAGE_ENDPOINT
        sync: false
      - key: NEON_STORAGE_REGION
        sync: false
      - key: NEON_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: NEON_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: NEON_STORAGE_BUCKET_NAME
        sync: false
