[project]
name = "ai-learning-companion"
version = "0.1.0"
description = "AI Learning Companion platform - modular monolith API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.117",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "celery>=5.4",
  "redis>=5.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "email-validator>=2.0",
  "groq>=0.9",
  "google-generativeai>=0.7",
  "pymupdf>=1.24",
  "boto3>=1.34",
]

[project.optional-dependencies]
ocr = ["paddlepaddle>=2.6", "paddleocr>=2.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["alembic/versions/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.alembic]
script_location = "alembic"
